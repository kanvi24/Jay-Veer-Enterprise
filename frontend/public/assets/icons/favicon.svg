  <text x="62" y="60" font-family="'Montserrat', sans-serif" font-size="34" font-weight="900" fill="#FE691E" text-anchor="middle">V</text>
  <!-- Three stars -->
  <circle cx="38" cy="74" r="2.5" fill="#ffb703" />
  <circle cx="50" cy="77" r="3.5" fill="#ffb703" />
  <circle cx="62" cy="74" r="2.5" fill="#ffb703" />
</svg>
