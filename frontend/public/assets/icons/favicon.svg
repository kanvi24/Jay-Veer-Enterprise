  </defs>
  <!-- Outer Shield border -->
  <path d="M50 5 L88 20 C88 55 68 85 50 95 C32 85 12 55 12 20 Z" fill="url(#shieldGrad)" stroke="#FE691E" stroke-width="4" stroke-linejoin="round"/>
  <!-- Crown accent at top -->
