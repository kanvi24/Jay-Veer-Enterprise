<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="100%" height="100%">
  <defs>
    <linearGradient id="siloBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0f2b5c" />
      <stop offset="100%" stop-color="#071326" />
    </linearGradient>
    <linearGradient id="siloMetal" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#cbd5e1" />
      <stop offset="40%" stop-color="#f8fafc" />
      <stop offset="80%" stop-color="#94a3b8" />
      <stop offset="100%" stop-color="#64748b" />
    </linearGradient>
  </defs>
  <rect width="600" height="400" fill="url(#siloBg)" />

  <!-- Silo 1 -->
  <g transform="translate(100, 80)">
    <path d="M0 50 Q50 0 100 50 Z" fill="url(#siloMetal)" />
    <rect x="0" y="50" width="100" height="200" fill="url(#siloMetal)" />
    <polygon points="0,250 100,250 60,290 40,290" fill="#64748b" />
    <rect x="10" y="70" width="80" height="15" fill="#0f2b5c" rx="2" />
    <text x="50" y="81" font-family="'Montserrat', sans-serif" font-weight="700" font-size="8" fill="#ffffff" text-anchor="middle">SILO 01 - LDPE</text>
  </g>

  <!-- Silo 2 (Center) -->
  <g transform="translate(240, 60)">
    <path d="M0 60 Q60 0 120 60 Z" fill="url(#siloMetal)" />
    <rect x="0" y="60" width="120" height="230" fill="url(#siloMetal)" />
    <polygon points="0,290 120,290 75,335 45,335" fill="#64748b" />
    <rect x="15" y="85" width="90" height="16" fill="#FE691E" rx="2" />
    <text x="60" y="97" font-family="'Montserrat', sans-serif" font-weight="700" font-size="9" fill="#ffffff" text-anchor="middle">SILO 02 - FILLER</text>
  </g>

  <!-- Silo 3 -->
  <g transform="translate(400, 80)">
    <path d="M0 50 Q50 0 100 50 Z" fill="url(#siloMetal)" />
    <rect x="0" y="50" width="100" height="200" fill="url(#siloMetal)" />
    <polygon points="0,250 100,250 60,290 40,290" fill="#64748b" />
    <rect x="10" y="70" width="80" height="15" fill="#0f2b5c" rx="2" />
    <text x="50" y="81" font-family="'Montserrat', sans-serif" font-weight="700" font-size="8" fill="#ffffff" text-anchor="middle">SILO 03 - REPRO</text>
  </g>

  <!-- Piping connections -->
  <path d="M150 120 L240 120 M360 120 L400 120" stroke="#FE691E" stroke-width="4" fill="none" />
  <path d="M290 335 L290 350 L550 350" stroke="#38bdf8" stroke-width="5" fill="none" />

  <!-- Industrial Floor -->
  <rect x="0" y="340" width="600" height="60" fill="#091426" />
  <line x1="0" y1="340" x2="600" y2="340" stroke="#FE691E" stroke-width="4"/>

  <rect x="30" y="30" width="310" height="40" rx="6" fill="#ffffff" opacity="0.1" />
  <text x="45" y="55" font-family="'Montserrat', sans-serif" font-weight="700" font-size="14" fill="#ffffff">BULK STORAGE & SILO FACILITY</text>
  <text x="45" y="375" font-family="'Inter', sans-serif" font-size="12" fill="#94a3b8">Continuous raw material buffering for large industrial bulk dispatch</text>
</svg>
