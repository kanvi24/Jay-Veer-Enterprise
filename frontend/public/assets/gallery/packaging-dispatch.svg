<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="100%" height="100%">
  <defs>
    <linearGradient id="packBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0f2b5c" />
      <stop offset="100%" stop-color="#0a1a36" />
    </linearGradient>
    <linearGradient id="sackGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="70%" stop-color="#f1f5f9" />
      <stop offset="100%" stop-color="#e2e8f0" />
    </linearGradient>
  </defs>
  <rect width="600" height="400" fill="url(#packBg)" />

  <!-- Pallet base -->
  <rect x="160" y="290" width="280" height="20" rx="3" fill="#854d0e" />
  <rect x="180" y="310" width="40" height="20" fill="#713f12" />
  <rect x="280" y="310" width="40" height="20" fill="#713f12" />
  <rect x="380" y="310" width="40" height="20" fill="#713f12" />

  <!-- Stack of 25KG Woven Polymer Sacks -->
  <!-- Layer 1 -->
  <g transform="translate(180, 230)">
    <rect x="0" y="0" width="115" height="55" rx="10" fill="url(#sackGrad)" stroke="#cbd5e1" stroke-width="2"/>
    <rect x="10" y="10" width="95" height="12" fill="#0f2b5c" rx="2" />
    <text x="57" y="19" font-family="'Montserrat', sans-serif" font-weight="700" font-size="8" fill="#ffffff" text-anchor="middle">JAY VEER</text>
    <text x="57" y="42" font-family="'Inter', sans-serif" font-weight="600" font-size="10" fill="#FE691E" text-anchor="middle">25 KG NET</text>
  </g>
  <g transform="translate(305, 230)">
    <rect x="0" y="0" width="115" height="55" rx="10" fill="url(#sackGrad)" stroke="#cbd5e1" stroke-width="2"/>
    <rect x="10" y="10" width="95" height="12" fill="#0f2b5c" rx="2" />
    <text x="57" y="19" font-family="'Montserrat', sans-serif" font-weight="700" font-size="8" fill="#ffffff" text-anchor="middle">JAY VEER</text>
    <text x="57" y="42" font-family="'Inter', sans-serif" font-weight="600" font-size="10" fill="#FE691E" text-anchor="middle">25 KG NET</text>
  </g>

  <!-- Layer 2 -->
  <g transform="translate(195, 170)">
    <rect x="0" y="0" width="105" height="55" rx="10" fill="url(#sackGrad)" stroke="#cbd5e1" stroke-width="2"/>
    <rect x="8" y="10" width="89" height="12" fill="#0f2b5c" rx="2" />
    <text x="52" y="19" font-family="'Montserrat', sans-serif" font-weight="700" font-size="8" fill="#ffffff" text-anchor="middle">JAY VEER</text>
    <text x="52" y="42" font-family="'Inter', sans-serif" font-weight="600" font-size="10" fill="#FE691E" text-anchor="middle">25 KG NET</text>
  </g>
  <g transform="translate(305, 170)">
    <rect x="0" y="0" width="105" height="55" rx="10" fill="url(#sackGrad)" stroke="#cbd5e1" stroke-width="2"/>
    <rect x="8" y="10" width="89" height="12" fill="#0f2b5c" rx="2" />
    <text x="52" y="19" font-family="'Montserrat', sans-serif" font-weight="700" font-size="8" fill="#ffffff" text-anchor="middle">JAY VEER</text>
    <text x="52" y="42" font-family="'Inter', sans-serif" font-weight="600" font-size="10" fill="#FE691E" text-anchor="middle">25 KG NET</text>
  </g>

  <!-- Layer 3 Top -->
  <g transform="translate(245, 110)">
    <rect x="0" y="0" width="110" height="55" rx="10" fill="url(#sackGrad)" stroke="#cbd5e1" stroke-width="2"/>
    <rect x="10" y="10" width="90" height="12" fill="#0f2b5c" rx="2" />
    <text x="55" y="19" font-family="'Montserrat', sans-serif" font-weight="700" font-size="8" fill="#ffffff" text-anchor="middle">JAY VEER</text>
    <text x="55" y="42" font-family="'Inter', sans-serif" font-weight="600" font-size="10" fill="#FE691E" text-anchor="middle">25 KG NET</text>
  </g>

  <!-- Forklift / Delivery Trust Sign -->
  <g transform="translate(470, 240)">
    <circle cx="40" cy="40" r="35" fill="#FE691E" />
    <path d="M25 40 L35 50 L55 30" stroke="#ffffff" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  </g>

  <!-- Industrial Floor -->
  <rect x="0" y="340" width="600" height="60" fill="#091426" />
  <line x1="0" y1="340" x2="600" y2="340" stroke="#FE691E" stroke-width="4"/>

  <rect x="30" y="30" width="290" height="40" rx="6" fill="#ffffff" opacity="0.1" />
  <text x="45" y="55" font-family="'Montserrat', sans-serif" font-weight="700" font-size="14" fill="#ffffff">MOISTURE-PROOF PACKAGING</text>
  <text x="45" y="375" font-family="'Inter', sans-serif" font-size="12" fill="#94a3b8">Standard 25kg HDPE woven bags with inner liner & palletized bulk dispatch</text>
</svg>
