<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="100%" height="100%">
  <defs>
    <radialGradient id="bgGrad" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#f8fafc" />
      <stop offset="100%" stop-color="#e2e8f0" />
    </radialGradient>
    <linearGradient id="whitePellet" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="60%" stop-color="#f1f5f9" />
      <stop offset="100%" stop-color="#cbd5e1" />
    </linearGradient>
    <filter id="drop" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="2" dy="4" stdDeviation="3" flood-opacity="0.15" />
    </filter>
  </defs>
  <rect width="600" height="400" fill="url(#bgGrad)" />
  
  <!-- Subtle Industrial Grid -->
  <path d="M0 50 H600 M0 100 H600 M0 150 H600 M0 200 H600 M0 250 H600 M0 300 H600 M0 350 H600" stroke="#cbd5e1" stroke-width="0.5" stroke-dasharray="4 4" opacity="0.4"/>
  <path d="M50 0 V400 M100 0 V400 M150 0 V400 M200 0 V400 M250 0 V400 M300 0 V400 M350 0 V400 M400 0 V400 M450 0 V400 M500 0 V400 M550 0 V400" stroke="#cbd5e1" stroke-width="0.5" stroke-dasharray="4 4" opacity="0.4"/>

  <!-- Presentation Dish / Container Base -->
  <ellipse cx="300" cy="270" rx="200" ry="85" fill="#0f2b5c" opacity="0.08" filter="blur(8px)" />
  <ellipse cx="300" cy="250" rx="190" ry="75" fill="#ffffff" stroke="#94a3b8" stroke-width="2" />
  <ellipse cx="300" cy="245" rx="180" ry="68" fill="#f8fafc" />

  <!-- Filler Granules Cluster -->
  <g filter="url(#drop)">
    <!-- Base Granules Layer -->
    <circle cx="210" cy="235" r="16" fill="url(#whitePellet)" stroke="#e2e8f0" stroke-width="1.5"/>
    <circle cx="240" cy="245" r="17" fill="url(#whitePellet)" stroke="#e2e8f0" stroke-width="1.5"/>
    <circle cx="275" cy="250" r="18" fill="url(#whitePellet)" stroke="#e2e8f0" stroke-width="1.5"/>
    <circle cx="310" cy="252" r="18" fill="url(#whitePellet)" stroke="#e2e8f0" stroke-width="1.5"/>
    <circle cx="350" cy="248" r="17" fill="url(#whitePellet)" stroke="#e2e8f0" stroke-width="1.5"/>
    <circle cx="390" cy="240" r="16" fill="url(#whitePellet)" stroke="#e2e8f0" stroke-width="1.5"/>
    
    <circle cx="180" cy="230" r="15" fill="url(#whitePellet)" stroke="#e2e8f0" stroke-width="1.5"/>
    <circle cx="420" cy="232" r="15" fill="url(#whitePellet)" stroke="#e2e8f0" stroke-width="1.5"/>
    <circle cx="150" cy="225" r="14" fill="url(#whitePellet)" stroke="#e2e8f0" stroke-width="1.5"/>
    <circle cx="450" cy="225" r="14" fill="url(#whitePellet)" stroke="#e2e8f0" stroke-width="1.5"/>

    <!-- Mid Layer -->
    <circle cx="225" cy="215" r="17" fill="url(#whitePellet)" stroke="#e2e8f0" stroke-width="1.5"/>
    <circle cx="260" cy="220" r="18" fill="url(#whitePellet)" stroke="#e2e8f0" stroke-width="1.5"/>
    <circle cx="300" cy="222" r="19" fill="url(#whitePellet)" stroke="#e2e8f0" stroke-width="1.5"/>
    <circle cx="340" cy="218" r="18" fill="url(#whitePellet)" stroke="#e2e8f0" stroke-width="1.5"/>
    <circle cx="375" cy="215" r="17" fill="url(#whitePellet)" stroke="#e2e8f0" stroke-width="1.5"/>

    <!-- Top Mound -->
    <circle cx="250" cy="190" r="17" fill="url(#whitePellet)" stroke="#e2e8f0" stroke-width="1.5"/>
    <circle cx="285" cy="188" r="18" fill="url(#whitePellet)" stroke="#e2e8f0" stroke-width="1.5"/>
    <circle cx="320" cy="185" r="18" fill="url(#whitePellet)" stroke="#e2e8f0" stroke-width="1.5"/>
    <circle cx="355" cy="190" r="17" fill="url(#whitePellet)" stroke="#e2e8f0" stroke-width="1.5"/>
    <circle cx="270" cy="165" r="16" fill="url(#whitePellet)" stroke="#e2e8f0" stroke-width="1.5"/>
    <circle cx="300" cy="160" r="17" fill="url(#whitePellet)" stroke="#e2e8f0" stroke-width="1.5"/>
    <circle cx="330" cy="165" r="16" fill="url(#whitePellet)" stroke="#e2e8f0" stroke-width="1.5"/>
    <circle cx="300" cy="140" r="15" fill="url(#whitePellet)" stroke="#e2e8f0" stroke-width="1.5"/>
  </g>

  <!-- Spec Badge -->
  <rect x="30" y="30" width="180" height="42" rx="8" fill="#0f2b5c" />
  <text x="45" y="56" font-family="'Montserrat', sans-serif" font-weight="700" font-size="14" fill="#ffffff">FILLER GRANULES</text>
  
  <rect x="420" y="30" width="150" height="32" rx="16" fill="#FE691E" />
  <text x="495" y="51" font-family="'Inter', sans-serif" font-weight="600" font-size="12" fill="#ffffff" text-anchor="middle">HIGH PURITY GRADE</text>
</svg>
