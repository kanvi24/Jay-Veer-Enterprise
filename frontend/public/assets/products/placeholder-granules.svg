<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="100%" height="100%">
  <defs>
    <radialGradient id="phBg" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#f8fafc" />
      <stop offset="100%" stop-color="#e2e8f0" />
    </radialGradient>
    <linearGradient id="pelletGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="60%" stop-color="#f1f5f9" />
      <stop offset="100%" stop-color="#cbd5e1" />
    </linearGradient>
    <linearGradient id="orangePellet" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FE691E" />
      <stop offset="100%" stop-color="#FE691E" />
    </linearGradient>
    <linearGradient id="bluePellet" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#163e7d" />
      <stop offset="100%" stop-color="#0c2340" />
    </linearGradient>
  </defs>

  <rect width="600" height="400" fill="url(#phBg)" />

  <!-- Industrial grid -->
  <path d="M0 50 H600 M0 100 H600 M0 150 H600 M0 200 H600 M0 250 H600 M0 300 H600 M0 350 H600" stroke="#cbd5e1" stroke-width="0.5" stroke-dasharray="4 4" opacity="0.4"/>
  <path d="M50 0 V400 M100 0 V400 M150 0 V400 M200 0 V400 M250 0 V400 M300 0 V400 M350 0 V400 M400 0 V400 M450 0 V400 M500 0 V400 M550 0 V400" stroke="#cbd5e1" stroke-width="0.5" stroke-dasharray="4 4" opacity="0.4"/>

  <!-- Dish Base -->
  <ellipse cx="300" cy="240" rx="160" ry="60" fill="#0f2b5c" opacity="0.08" />
  <ellipse cx="300" cy="225" rx="150" ry="50" fill="#ffffff" stroke="#cbd5e1" stroke-width="2" />
  <ellipse cx="300" cy="220" rx="140" ry="44" fill="#f8fafc" />

  <!-- Granule Pellets Cluster -->
  <circle cx="250" cy="210" r="14" fill="url(#pelletGrad)" stroke="#cbd5e1" stroke-width="1.5" />
  <circle cx="280" cy="215" r="15" fill="url(#orangePellet)" stroke="#FE691E" stroke-width="1.5" />
  <circle cx="310" cy="205" r="14" fill="url(#bluePellet)" stroke="#08162b" stroke-width="1.5" />
  <circle cx="340" cy="215" r="13" fill="url(#pelletGrad)" stroke="#cbd5e1" stroke-width="1.5" />
  <circle cx="265" cy="225" r="14" fill="url(#pelletGrad)" stroke="#cbd5e1" stroke-width="1.5" />
  <circle cx="295" cy="230" r="15" fill="url(#pelletGrad)" stroke="#cbd5e1" stroke-width="1.5" />
  <circle cx="325" cy="228" r="14" fill="url(#orangePellet)" stroke="#FE691E" stroke-width="1.5" />
  <circle cx="300" cy="195" r="13" fill="url(#pelletGrad)" stroke="#cbd5e1" stroke-width="1.5" />

  <!-- Badge / Text Label -->
  <rect x="180" y="300" width="240" height="34" rx="17" fill="#0c2340" />
  <text x="300" y="322" font-family="'Montserrat', sans-serif" font-size="12" font-weight="700" fill="#ffffff" text-anchor="middle" letter-spacing="1">
    JAY VEER ENTERPRISE
  </text>
  <text x="300" y="352" font-family="'Inter', sans-serif" font-size="12" fill="#64748b" text-anchor="middle">
    Polymer Granules &amp; Raw Material
  </text>
</svg>
