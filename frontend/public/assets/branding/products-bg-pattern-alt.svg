<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 900" width="100%" height="100%" preserveAspectRatio="xMidYMid slice">
  <defs>
    <!-- Soft granule gradient -->
    <radialGradient id="altGranuleOrange" cx="40%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#FE691E" stop-opacity="0.08" />
      <stop offset="100%" stop-color="#FE691E" stop-opacity="0.05" />
    </radialGradient>
    <radialGradient id="altGranuleNavy" cx="40%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#163e7d" stop-opacity="0.07" />
      <stop offset="100%" stop-color="#0c2340" stop-opacity="0.05" />
    </radialGradient>
    <radialGradient id="altGranuleLightBlue" cx="40%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#bae6fd" stop-opacity="0.08" />
      <stop offset="100%" stop-color="#0284c7" stop-opacity="0.05" />
    </radialGradient>
  </defs>

  <!-- 1. THIN CURVED TECHNICAL LINES & SPLINES (COMPLEMENTARY INVERSION) -->
  <!-- Upper technical spline (Dark Navy) -->
  <path d="M-50 240 C 450 360, 950 120, 1500 280" fill="none" stroke="#0c2340" stroke-width="1.3" stroke-opacity="0.06" />
  
  <!-- Faint cooling blue technical spline -->
  <path d="M-50 340 C 350 480, 850 210, 1500 370" fill="none" stroke="#0284c7" stroke-width="1.1" stroke-dasharray="6 7" stroke-opacity="0.06" />

  <!-- Central flowing polymer extrusion curve (Orange) -->
  <path d="M-60 490 C 380 320, 820 620, 1500 450" fill="none" stroke="#FE691E" stroke-width="1.5" stroke-opacity="0.07" />

  <!-- Lower dashed technical guide line (Dark Navy) -->
  <path d="M-40 760 C 420 860, 980 620, 1490 740" fill="none" stroke="#0c2340" stroke-width="1" stroke-dasharray="7 6" stroke-opacity="0.05" />

  <!-- Technical vertical/diagonal cross-flow (Orange & Light Blue) -->
  <path d="M1100 -50 C 950 280, 1020 580, 880 950" fill="none" stroke="#FE691E" stroke-width="1" stroke-opacity="0.05" />
  <path d="M350 -50 C 220 320, 410 650, 260 950" fill="none" stroke="#0284c7" stroke-width="0.9" stroke-opacity="0.05" />

  <!-- 2. ABSTRACT CONCENTRIC TECHNICAL ARCS -->
  <!-- Top Left Engineering Motif -->
  <g transform="translate(90, 80)">
    <circle cx="0" cy="0" r="100" fill="none" stroke="#FE691E" stroke-width="1" stroke-dasharray="6 6" stroke-opacity="0.06" />
    <circle cx="0" cy="0" r="135" fill="none" stroke="#0284c7" stroke-width="0.9" stroke-opacity="0.05" />
    <circle cx="0" cy="0" r="160" fill="none" stroke="#0c2340" stroke-width="0.9" stroke-opacity="0.05" />
    <circle cx="0" cy="0" r="220" fill="none" stroke="#FE691E" stroke-width="0.7" stroke-opacity="0.04" />
    <line x1="0" y1="90" x2="0" y2="230" stroke="#0c2340" stroke-width="0.8" stroke-opacity="0.04" />
  </g>

  <!-- Bottom Right Engineering Motif -->
  <g transform="translate(1350, 820)">
    <circle cx="0" cy="0" r="120" fill="none" stroke="#0c2340" stroke-width="1" stroke-opacity="0.05" />
    <circle cx="0" cy="0" r="155" fill="none" stroke="#0284c7" stroke-width="0.8" stroke-opacity="0.05" />
    <circle cx="0" cy="0" r="190" fill="none" stroke="#FE691E" stroke-width="1" stroke-dasharray="8 6" stroke-opacity="0.06" />
    <circle cx="0" cy="0" r="260" fill="none" stroke="#0c2340" stroke-width="0.7" stroke-opacity="0.04" />
  </g>

  <!-- 3. POLYMER MOLECULAR STRUCTURES -->
  <!-- Upper Right Molecular Chain -->
  <g>
    <line x1="1120" y1="160" x2="1190" y2="120" stroke="#0c2340" stroke-width="1.2" stroke-opacity="0.06" />
    <line x1="1190" y1="120" x2="1260" y2="165" stroke="#FE691E" stroke-width="1.2" stroke-opacity="0.07" />
    <line x1="1260" y1="165" x2="1330" y2="125" stroke="#0284c7" stroke-width="1.2" stroke-opacity="0.06" />
    <circle cx="1120" cy="160" r="9" fill="url(#altGranuleNavy)" stroke="#0c2340" stroke-width="1.2" stroke-opacity="0.07" />
    <circle cx="1190" cy="120" r="14" fill="url(#altGranuleOrange)" stroke="#FE691E" stroke-width="1.2" stroke-opacity="0.07" />
    <circle cx="1260" cy="165" r="11" fill="url(#altGranuleNavy)" stroke="#0c2340" stroke-width="1.2" stroke-opacity="0.07" />
    <circle cx="1330" cy="125" r="8" fill="url(#altGranuleLightBlue)" stroke="#0284c7" stroke-width="1.2" stroke-opacity="0.06" />
    <circle cx="1190" cy="120" r="30" fill="none" stroke="#FE691E" stroke-width="0.8" stroke-dasharray="4 4" stroke-opacity="0.05" />
  </g>

  <!-- Lower Left Molecular Chain -->
  <g>
    <line x1="140" y1="670" x2="210" y2="710" stroke="#FE691E" stroke-width="1.2" stroke-opacity="0.07" />
    <line x1="210" y1="710" x2="280" y2="665" stroke="#0284c7" stroke-width="1.2" stroke-opacity="0.06" />
    <line x1="280" y1="665" x2="350" y2="705" stroke="#0c2340" stroke-width="1.2" stroke-opacity="0.06" />
    <circle cx="140" cy="670" r="8" fill="url(#altGranuleOrange)" stroke="#FE691E" stroke-width="1.2" stroke-opacity="0.07" />
    <circle cx="210" cy="710" r="13" fill="url(#altGranuleLightBlue)" stroke="#0284c7" stroke-width="1.2" stroke-opacity="0.06" />
    <circle cx="280" cy="665" r="10" fill="url(#altGranuleOrange)" stroke="#FE691E" stroke-width="1.2" stroke-opacity="0.07" />
    <circle cx="350" cy="705" r="8" fill="url(#altGranuleNavy)" stroke="#0c2340" stroke-width="1.2" stroke-opacity="0.07" />
  </g>

  <!-- 4. FLOATING SUBTLE GRANULE / PELLET SILHOUETTES -->
  <ellipse cx="360" cy="380" rx="14" ry="10" transform="rotate(22 360 380)" fill="url(#altGranuleOrange)" stroke="#FE691E" stroke-width="0.8" stroke-opacity="0.06" />
  <ellipse cx="400" cy="405" rx="12" ry="9" transform="rotate(-15 400 405)" fill="url(#altGranuleLightBlue)" stroke="#0284c7" stroke-width="0.8" stroke-opacity="0.06" />
  <ellipse cx="1080" cy="540" rx="15" ry="10" transform="rotate(-25 1080 540)" fill="url(#altGranuleOrange)" stroke="#FE691E" stroke-width="0.8" stroke-opacity="0.06" />
  <ellipse cx="1120" cy="565" rx="13" ry="9" transform="rotate(18 1120 565)" fill="url(#altGranuleNavy)" stroke="#0c2340" stroke-width="0.8" stroke-opacity="0.05" />

  <!-- 5. SMALL DOTTED ELEMENTS (Industrial Engineering Grid Matrix with Faint Blue Accents) -->
  <g fill="#FE691E" fill-opacity="0.06">
    <circle cx="180" cy="220" r="1.5" />
    <circle cx="210" cy="220" r="1.5" />
    <circle cx="240" cy="220" r="1.5" />
    <circle cx="270" cy="220" r="1.5" />
    <circle cx="180" cy="250" r="1.5" />
    <circle cx="210" cy="250" r="1.5" />
    <circle cx="240" cy="250" r="1.5" />
    <circle cx="270" cy="250" r="1.5" />
  </g>
  <g fill="#0284c7" fill-opacity="0.06">
    <circle cx="1180" cy="680" r="1.5" />
    <circle cx="1210" cy="680" r="1.5" />
    <circle cx="1240" cy="680" r="1.5" />
    <circle cx="1270" cy="680" r="1.5" />
    <circle cx="1180" cy="710" r="1.5" />
    <circle cx="1210" cy="710" r="1.5" />
    <circle cx="1240" cy="710" r="1.5" />
    <circle cx="1270" cy="710" r="1.5" />
  </g>
</svg>
